name: Agente de Code Review con IA

on:
  pull_request:
    types: [opened, synchronize] # Se activa al abrir un PR o al subir nuevos commits

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Permiso crucial para que el agente comente la línea exacta

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Descarga el historial para poder comparar el código anterior con el nuevo

      - name: Ejecutar Agente de Revisión
        uses: villesau/ai-code-review-action@v2.7.0 # Acción de la comunidad que orquesta la API
        with:
          openai_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }} # Token automático de GitHub para autenticar el bot
          model: "gpt-4o" # Puedes elegir el modelo que prefieras
          exclude: "**/*.json,**/*.md" # Archivos que el agente debe ignorar para ahorrar costos
