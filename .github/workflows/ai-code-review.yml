name: Agente de Code Review con Gemini

on:
  pull_request:
    types: [opened, synchronize] # Se activa al abrir un PR o subir nuevos cambios

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Permiso obligatorio para que Gemini comente en la PR

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Descarga el historial completo para comparar los cambios

      - name: Ejecutar Agente de Revisión con Gemini
        uses: rubensflinco/gemini-code-review-action@1.0.5 # Nombre del repositorio corregido
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_repository: ${{ github.repository }}
          github_pull_request_number: ${{ github.event.pull_request.number }}
          git_commit_hash: ${{ github.event.pull_request.head.sha }}
          model: "gemini-1.5-flash" # Modelo rápido e inteligente del tier gratuito

