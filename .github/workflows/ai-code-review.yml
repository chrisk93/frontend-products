name: Agente de Code Review con Gemini

on:
  pull_request:
    types: [opened, synchronize] # Se activa al abrir un PR o subir nuevos cambios

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Permiso obligatorio para que Gemini comente en la PR

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Descarga el historial completo para comparar los cambios

      - name: Ejecutar Agente de Revisión con Gemini
        uses: rubensflinco/code-review-by-gemini-ai@v1.0.5 # Acción optimizada para la API de Gemini
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }} # Tu clave gratuita guardada en los Secrets
          github_token: ${{ secrets.GITHUB_TOKEN }} # Token automático de GitHub para comentar
          model: "gemini-1.5-flash" # Modelo rápido, inteligente y gratuito
